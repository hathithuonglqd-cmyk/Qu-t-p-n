        <div class="bg-blue-600 text-white p-4 text-center shadow z-10">
            <h1 class="text-xl font-bold uppercase tracking-wider"><i class="fa-solid fa-qrcode mr-2"></i>Máy Quét Trắc Nghiệm</h1>
            <p class="text-sm text-blue-200">Không cần cài đặt ứng dụng</p>
        </div>
        
        <!-- Camera Area -->
        <div class="relative w-full bg-black flex-1 overflow-hidden flex items-center justify-center">
            <video id="video" class="absolute w-full h-full object-cover" autoplay playsinline></video>
            <!-- Canvas đè lên video để vẽ khung nhận diện -->
            <canvas id="canvas" class="absolute w-full h-full object-cover"></canvas>
            
            <div id="start-overlay" class="absolute inset-0 bg-black/60 flex items-center justify-center z-20">
                <button id="start-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition active:scale-95 text-lg">

                </button>
            </div>
        </div>

        <!-- Bảng điều khiển và thống kê -->
        <div class="p-4 bg-white z-10 border-t-2 border-gray-200">
            <div class="flex justify-between items-center mb-3">
                <p class="text-gray-600 font-semibold text-sm">Trạng thái: <span id="status-text" class="text-blue-500">Đang chờ...</span></p>

            </div>

                    </div>

                        <p class="text-4xl font-black text-blue-600" id="last-answer">-</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
